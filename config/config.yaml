# =====================================================================
# ZIRI — AI Gaming Copilot Configuration
# =====================================================================

project:
  name: "Ziri"
  version: "0.1.0-dev"
  environment: "development"

# ---------------------------------------------------------------------
# Configuración del Juego Activo
# ---------------------------------------------------------------------
game:
  active_adapter: "poe2"
  window_title_keywords:
    - "Path of Exile 2"
    - "PathofExile"

# ---------------------------------------------------------------------
# Módulo de Captura y Visión Local (OCR + OpenCV)
# ---------------------------------------------------------------------
vision:
  enabled: true
  mode: "local_ocr"            # Alineado con la arquitectura OCR determinista
  engine: "tesseract"          # O easyocr
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: [8, 8]
  scale_factor: 2.0

# ---------------------------------------------------------------------
# Integración de Contexto de Usuario (Path of Building)
# ---------------------------------------------------------------------
integrations:
  pob:
    enabled: true
    default_build_path: "./data/user_context/current_build.xml"

# ---------------------------------------------------------------------
# Motor RAG Local Estático (ChromaDB)
# ---------------------------------------------------------------------
rag:
  vector_store: "chroma"
  chroma_persist_dir: "./data/vector_store/chroma"
  collection_name: "atziri_kb"
  embedding_model: "all-MiniLM-L6-v2"  # Modelo estático ligero en RAM
  top_k_results: 4

# ---------------------------------------------------------------------
# Herramientas Dinámicas (Tool Calling en Tiempo Real)
# ---------------------------------------------------------------------
tools:
  poe_ninja:
    enabled: true
    cache_ttl_hours: 24
  youtube_transcripts:
    enabled: true
    max_results: 3

# ---------------------------------------------------------------------
# Proveedor de Inteligencia Artificial (LLM)
# ---------------------------------------------------------------------
llm:
  provider: "gemini"
  model_name: "gemini-2.0-flash"  # Optimizado para inferencia y razonamiento rápido
  temperature: 0.2
  max_tokens: 800

# ---------------------------------------------------------------------
# Interfaz de Usuario (Overlay PyQt6)
# ---------------------------------------------------------------------
ui:
  framework: "pyqt6"
  always_on_top: true
  opacity: 0.90
  hotkeys:
    trigger_capture: "ctrl+space"
    toggle_overlay: "ctrl+shift+z"